name: PR-Agent
on:
  # pull_request:
    # types: [opened, reopened, edited]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Run CodiumAI PR-Agent
        uses: qodo-ai/pr-agent@eb4cdbb115dfb711375a24eccc75e3ef73ec03bc # v0.30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "anthropic/claude-sonnet-4-5-20250929"
          config.fallback_models: '["anthropic/claude-haiku-4-5-20251001"]'
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
